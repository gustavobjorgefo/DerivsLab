[build-system]
requires = ["setuptools>=61","wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "derivslab"
version = "0.0.0"
description = "DerivsLab — option pricing, volatility and greeks research"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name="Jorge Filho Gustavo", email="gustavob.jorge@hotmail.com"}
]
license = {text = "MIT"}

[tool.black]
line-length = 99
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 99

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/derivslab"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "\\.\\.\\."]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
disallow_untyped_defs = true
disallow_any_generics = true
warn_return_any = true
warn_unused_ignores = true
files = ["src"]
exclude = ["src/derivslab/instruments/deprecated/"]

[[tool.mypy.overrides]]
module = ["scipy.*", "yfinance.*"]
ignore_missing_imports = true

# Legacy modules pending refactor. Type checking is disabled here rather
# than fixed in place, since the implementation itself is being replaced.
# Remove each entry as its module is refactored under the current
# type-checking standard.
[[tool.mypy.overrides]]
module = [
    "derivslab.volatility.*",
    "derivslab.pricing.pricing_models",
    "derivslab.greeks.vanilla_greeks",
    "derivslab.simulation.*",
    "derivslab.utils.*",
]
ignore_errors = true